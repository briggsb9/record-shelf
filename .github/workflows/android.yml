name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android platform
        run: "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \"platforms;android-36\" \"build-tools;36.0.0\""

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Android
        run: npm run android:sync

      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Record-Shelf-Android-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: record-shelf-android-debug
          path: Record-Shelf-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
